name: Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build installer
        run: npm run dist

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="$GITHUB_REF_NAME"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match package version $VERSION"
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag \
              --title "MuseGarden $VERSION" \
              --notes "Windows installer for MuseGarden $VERSION."
          fi
          gh release upload "$TAG" \
            "dist/MuseGarden-Setup-$VERSION.exe" \
            "dist/MuseGarden-Setup-$VERSION.exe.blockmap" \
            dist/latest.yml \
            --clobber

      - name: Upload installer artifact
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: musegarden-windows
          path: |
            dist/*.exe
            dist/*.yml
